<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE UNIT CIRCLE ENGINE</title>
    <style>
        :root {
            --bg: #000000;
            --panel: rgba(10, 10, 10, 0.95);
            --border: #333;
            --accent: #00ffcc;
            --text: #aaa;
            --text-hi: #fff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Consolas', 'Monaco', monospace;
            color: var(--text);
            user-select: none;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        /* THE CONTROL PANEL - FLOATING */
        #ui-container {
            position: absolute;
            top: 0;
            right: 0;
            width: 340px;
            height: 100vh;
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            z-index: 100;
            transition: transform 0.3s ease;
        }
        
        #ui-container.collapsed {
            transform: translateX(340px);
        }

        #ui-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
        }
        
        h1 { margin: 0; font-size: 14px; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; }

        #toggle-ui {
            position: absolute;
            left: -30px;
            top: 50%;
            width: 30px;
            height: 60px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-right: none;
            cursor: pointer;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            border-radius: 4px 0 0 4px;
        }

        /* SCROLLABLE CONTENT */
        #ui-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* CUSTOM SCROLLBAR */
        #ui-content::-webkit-scrollbar { width: 6px; }
        #ui-content::-webkit-scrollbar-track { background: #000; }
        #ui-content::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        /* SECTIONS */
        .section {
            border: 1px solid var(--border);
            margin-bottom: 10px;
            background: rgba(255,255,255,0.02);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .section-header {
            padding: 8px 10px;
            background: #1a1a1a;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            display: flex;
            justify-content: space-between;
        }
        .section-header:hover { background: #252525; }
        .section-header::after { content: '+'; }
        .section.open .section-header::after { content: '-'; }

        .section-body {
            display: none;
            padding: 10px;
        }
        .section.open .section-body { display: block; }

        /* CONTROLS */
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 10px;
        }
        
        label { flex: 1; color: #ccc; }
        
        input[type="range"] {
            flex: 1.5;
            height: 2px;
            background: #444;
            -webkit-appearance: none;
            margin: 0 10px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="color"] {
            width: 20px; height: 20px;
            background: none; border: none;
            cursor: pointer;
            padding: 0;
        }

        input[type="checkbox"] { cursor: pointer; }
        
        .val-display { width: 35px; text-align: right; color: var(--accent); }

        /* BUTTONS */
        .btn-row { display: flex; gap: 5px; margin-top: 10px; }
        button {
            flex: 1;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            text-transform: uppercase;
            transition: 0.2s;
        }
        button:hover { background: var(--accent); color: #000; }
        button.danger:hover { background: #f05; color: #fff; }

        /* STATS OVERLAY */
        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            pointer-events: none;
            line-height: 1.4;
        }
        .stat-val { color: var(--accent); font-weight: bold; margin-left: 10px; }

    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    
    <div id="stats">
        <div>FPS: <span id="fps" class="stat-val">60</span></div>
        <div>θ (rad): <span id="rad" class="stat-val">0.00</span></div>
        <div>Coords: <span id="coords" class="stat-val">0, 0</span></div>
    </div>

    <div id="ui-container">
        <div id="toggle-ui" onclick="document.getElementById('ui-container').classList.toggle('collapsed')">⚙</div>
        
        <div id="ui-header">
            <h1>UNIT CORE v9.0</h1>
            <div style="font-size:10px; color:#555">DEV: USER</div>
        </div>

        <div id="ui-content">
            <!-- Dynamic Content Injected Here -->
        </div>

        <div style="padding:10px; border-top:1px solid #333; background:#050505">
            <button onclick="randomize()" style="width:100%; margin-bottom:5px;">🎲 CHAOS RANDOMIZE</button>
            <button onclick="resetDefaults()" class="danger" style="width:100%">⚠ FACTORY RESET</button>
        </div>
    </div>

<script>
/**
 * THE ARCHITECTURE
 * 1. Params Object: The Single Source of Truth for every variable.
 * 2. UI Generator: Automatically builds the control panel based on the Params object.
 * 3. Render Engine: Draws the frame based on current Params.
 */

// ==========================================
// 1. CONFIGURATION "THE BRAIN"
// ==========================================
const P = {
    // --- GLOBAL ---
    Simulation: {
        speed: { val: 1.0, min: -5, max: 5, step: 0.1 },
        radius: { val: 200, min: 10, max: 500, step: 1 },
        trail: { val: 0.15, min: 0.01, max: 1.0, step: 0.01, name: "Ghosting Fade" },
        segments: { val: 0, min: 0, max: 12, step: 1, name: "Polygon Sides (0=Circle)" },
        lineWidth: { val: 2, min: 0.5, max: 10, step: 0.5 },
        paused: { val: false, type: 'bool' },
        showGrid: { val: true, type: 'bool' }
    },

    // --- MATH HACKS ---
    Math_Mods: {
        xMult: { val: 1, min: 1, max: 20, step: 1, name: "X Frequency (Lissajous)" },
        yMult: { val: 1, min: 1, max: 20, step: 1, name: "Y Frequency" },
        phaseShift: { val: 0, min: 0, max: 360, step: 1, name: "Phase Shift (Deg)" },
        distortion: { val: 0, min: 0, max: 50, step: 0.1, name: "Noise/Jitter" }
    },

    // --- LFO (AUTO-ANIMATION) ---
    LFO: {
        active: { val: false, type: 'bool' },
        target: { val: 'radius', type: 'select', options: ['radius', 'speed', 'segments'] },
        rate: { val: 0.5, min: 0.01, max: 5, step: 0.01 },
        depth: { val: 50, min: 0, max: 300, step: 1 }
    },

    // --- FUNCTIONS ---
    Cos_X: {
        show: { val: true, type: 'bool' },
        color: { val: '#00ccff', type: 'color' },
        width: { val: 2, min: 0.1, max: 10, step: 0.1 },
        wave: { val: true, type: 'bool', name: "Draw Wave" }
    },
    Sin_Y: {
        show: { val: true, type: 'bool' },
        color: { val: '#ff0055', type: 'color' },
        width: { val: 2, min: 0.1, max: 10, step: 0.1 },
        wave: { val: true, type: 'bool', name: "Draw Wave" }
    },
    Tan: {
        show: { val: true, type: 'bool' },
        color: { val: '#ccff00', type: 'color' },
        limit: { val: 1000, min: 100, max: 5000, step: 100, name: "Clip Length" }
    },
    Sec: { show: { val: false, type: 'bool' }, color: '#ffaa00', type: 'color' },
    Csc: { show: { val: false, type: 'bool' }, color: '#aa00ff', type: 'color' },
    Cot: { show: { val: false, type: 'bool' }, color: '#00ffaa', type: 'color' },

    // --- WAVES VISUALIZER ---
    Wave_Settings: {
        spacing: { val: 2, min: 0.5, max: 10, step: 0.5 },
        offset: { val: 50, min: 0, max: 300, step: 10, name: "Distance from Circle" },
        length: { val: 500, min: 100, max: 2000, step: 50, name: "History Length" }
    },

    // --- PARTICLES ---
    Particles: {
        enable: { val: false, type: 'bool' },
        count: { val: 5, min: 1, max: 20, step: 1, name: "Emission Rate" },
        decay: { val: 0.95, min: 0.8, max: 0.99, step: 0.01 },
        scatter: { val: 2, min: 0, max: 10, step: 0.1 }
    }
};

// State that isn't user-configurable directly
const State = {
    angle: 0,
    time: 0,
    particles: [],
    history: { sin: [], cos: [] },
    canvas: null,
    ctx: null,
    cx: 0, cy: 0,
    dragging: false,
    dragStartAngle: 0
};

// ==========================================
// 2. UI GENERATOR
// ==========================================
function initUI() {
    const container = document.getElementById('ui-content');
    container.innerHTML = ''; // Clear

    for (const [sectionKey, params] of Object.entries(P)) {
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'section';
        if(sectionKey === 'Simulation' || sectionKey === 'Math_Mods') sectionDiv.classList.add('open');

        const header = document.createElement('div');
        header.className = 'section-header';
        header.textContent = sectionKey.replace('_', ' ');
        header.onclick = () => sectionDiv.classList.toggle('open');
        sectionDiv.appendChild(header);

        const body = document.createElement('div');
        body.className = 'section-body';

        for (const [key, config] of Object.entries(params)) {
            const row = document.createElement('div');
            row.className = 'control-row';

            // Label
            const label = document.createElement('label');
            label.textContent = config.name || key;
            row.appendChild(label);

            let input;

            // Simple Color String handling (legacy from object structure)
            if (typeof config === 'string' && config.startsWith('#')) {
                 input = document.createElement('input');
                 input.type = 'color';
                 input.value = config;
                 input.oninput = (e) => P[sectionKey][key] = e.target.value;
                 row.appendChild(input);
            }
            // Complex Config Object
            else {
                if (config.type === 'bool') {
                    input = document.createElement('input');
                    input.type = 'checkbox';
                    input.checked = config.val;
                    input.onchange = (e) => config.val = e.target.checked;
                    row.appendChild(input);
                } 
                else if (config.type === 'color') {
                    input = document.createElement('input');
                    input.type = 'color';
                    input.value = config.val;
                    input.oninput = (e) => config.val = e.target.value;
                    row.appendChild(input);
                }
                else if (config.type === 'select') {
                    input = document.createElement('select');
                    input.style.width = "60px";
                    input.style.background = "#333";
                    input.style.color = "#fff";
                    input.style.border = "none";
                    config.options.forEach(opt => {
                        const o = document.createElement('option');
                        o.value = opt;
                        o.textContent = opt;
                        input.appendChild(o);
                    });
                    input.value = config.val;
                    input.onchange = (e) => config.val = e.target.value;
                    row.appendChild(input);
                }
                else {
                    // Range Slider
                    input = document.createElement('input');
                    input.type = 'range';
                    input.min = config.min;
                    input.max = config.max;
                    input.step = config.step;
                    input.value = config.val;
                    
                    const valDisp = document.createElement('span');
                    valDisp.className = 'val-display';
                    valDisp.textContent = config.val;

                    input.oninput = (e) => {
                        let v = parseFloat(e.target.value);
                        config.val = v;
                        valDisp.textContent = v;
                    };
                    
                    row.appendChild(input);
                    row.appendChild(valDisp);
                }
            }
            body.appendChild(row);
        }
        sectionDiv.appendChild(body);
        container.appendChild(sectionDiv);
    }
}

// ==========================================
// 3. LOGIC & MATH ENGINE
// ==========================================

function update() {
    if (!P.Simulation.paused.val && !State.dragging) {
        // Base Speed
        State.angle += P.Simulation.speed.val * 0.02;
    }

    State.time += 0.01;

    // LFO Logic
    if(P.LFO.active.val) {
        const lfoVal = Math.sin(State.time * P.LFO.rate.val) * P.LFO.depth.val;
        const target = P.LFO.target.val;
        
        // We temporarily offset the visual value, but don't overwrite base config
        // This is a simplification; for robust LFO we'd separate base vs current
        // For now, we'll just hack it into the calculation phase or modify visual radius directly
    }

    // Particle Logic
    if (P.Particles.enable.val) {
        // Add particles
        const r = getCurrentRadius();
        const x = Math.cos(State.angle * P.Math_Mods.xMult.val) * r;
        const y = Math.sin(State.angle * P.Math_Mods.yMult.val) * r;
        
        for(let i=0; i<P.Particles.count.val; i++) {
            State.particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * P.Particles.scatter.val,
                vy: (Math.random() - 0.5) * P.Particles.scatter.val,
                life: 1.0,
                color: Math.random() > 0.5 ? P.Cos_X.color.val : P.Sin_Y.color.val
            });
        }
    }

    // Update Particles
    for(let i = State.particles.length - 1; i >= 0; i--) {
        let p = State.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life *= P.Particles.decay.val;
        if(p.life < 0.05) State.particles.splice(i, 1);
    }

    updateStats();
}

function getCurrentRadius() {
    let r = P.Simulation.radius.val;
    if(P.LFO.active.val && P.LFO.target.val === 'radius') {
        r += Math.sin(State.time * P.LFO.rate.val) * P.LFO.depth.val;
    }
    return Math.max(0, r);
}

function updateStats() {
    const r = getCurrentRadius();
    const xMult = P.Math_Mods.xMult.val;
    const yMult = P.Math_Mods.yMult.val;
    
    // Normalize angle for display
    let dispAngle = (State.angle % (Math.PI*2));
    if(dispAngle < 0) dispAngle += Math.PI*2;

    const x = Math.cos(State.angle * xMult) * r;
    const y = Math.sin(State.angle * yMult) * r;

    document.getElementById('rad').textContent = dispAngle.toFixed(2) + "π";
    document.getElementById('coords').textContent = `x:${x.toFixed(0)} y:${y.toFixed(0)}`;
}

// ==========================================
// 4. RENDER ENGINE
// ==========================================
function draw() {
    State.ctx.fillStyle = `rgba(0, 0, 0, ${P.Simulation.trail.val})`;
    State.ctx.fillRect(0, 0, State.canvas.width, State.canvas.height);

    State.ctx.save();
    State.ctx.translate(State.cx, State.cy);

    // Apply distortion/shake if active
    if(P.Math_Mods.distortion.val > 0) {
        const d = P.Math_Mods.distortion.val;
        State.ctx.translate((Math.random()-0.5)*d, (Math.random()-0.5)*d);
    }

    const R = getCurrentRadius();
    const LW = P.Simulation.lineWidth.val;
    const phaseRad = P.Math_Mods.phaseShift.val * (Math.PI/180);

    // Current Math Position
    // We treat Y as inverted for canvas (down is positive), but usually unit circles have Y up.
    // For visual simplicity, we'll keep canvas coords (Y down) but can invert math if requested.
    // We will stick to standard Canvas coordinates.
    
    const xFreq = P.Math_Mods.xMult.val;
    const yFreq = P.Math_Mods.yMult.val;

    const currentX = Math.cos(State.angle * xFreq + phaseRad) * R;
    const currentY = Math.sin(State.angle * yFreq) * R;

    // --- 1. DRAW GRID ---
    if (P.Simulation.showGrid.val) {
        State.ctx.strokeStyle = '#222';
        State.ctx.lineWidth = 1;
        State.ctx.beginPath();
        State.ctx.moveTo(-State.cx, 0); State.ctx.lineTo(State.cx, 0);
        State.ctx.moveTo(0, -State.cy); State.ctx.lineTo(0, State.cy);
        State.ctx.stroke();

        State.ctx.strokeStyle = '#333';
        State.ctx.beginPath();
        if(P.Simulation.segments.val === 0) {
            State.ctx.arc(0, 0, R, 0, Math.PI * 2);
        } else {
            // Polygon Mode
            const sides = P.Simulation.segments.val;
            State.ctx.moveTo(R, 0);
            for(let i=1; i<=sides; i++) {
                State.ctx.lineTo(
                    Math.cos(i * 2 * Math.PI / sides) * R,
                    Math.sin(i * 2 * Math.PI / sides) * R
                );
            }
        }
        State.ctx.stroke();
    }

    // --- 2. TRIG FUNCTIONS ---

    // Cosine (X)
    if(P.Cos_X.show.val) {
        State.ctx.strokeStyle = P.Cos_X.color.val;
        State.ctx.lineWidth = P.Cos_X.width.val;
        State.ctx.beginPath();
        State.ctx.moveTo(0, 0);
        State.ctx.lineTo(currentX, 0);
        State.ctx.stroke();
        
        // Drop line
        State.ctx.setLineDash([5, 5]);
        State.ctx.lineWidth = 1;
        State.ctx.beginPath();
        State.ctx.moveTo(currentX, 0);
        State.ctx.lineTo(currentX, currentY);
        State.ctx.stroke();
        State.ctx.setLineDash([]);
    }

    // Sine (Y)
    if(P.Sin_Y.show.val) {
        State.ctx.strokeStyle = P.Sin_Y.color.val;
        State.ctx.lineWidth = P.Sin_Y.width.val;
        State.ctx.beginPath();
        State.ctx.moveTo(0, 0);
        State.ctx.lineTo(0, currentY);
        State.ctx.stroke();

        // Drop line
        State.ctx.setLineDash([5, 5]);
        State.ctx.lineWidth = 1;
        State.ctx.beginPath();
        State.ctx.moveTo(0, currentY);
        State.ctx.lineTo(currentX, currentY);
        State.ctx.stroke();
        State.ctx.setLineDash([]);
    }

    // Tangent
    if(P.Tan.show.val) {
        State.ctx.strokeStyle = P.Tan.color.val;
        State.ctx.lineWidth = 2;
        // Tangent line is perpendicular to radius. 
        // Slope of radius = tan(theta). Slope of tangent = -1/tan(theta).
        // It passes through (currentX, currentY).
        // Let's draw a line of length 'limit' in both directions of that slope.
        
        const normX = Math.cos(State.angle * xFreq + phaseRad);
        const normY = Math.sin(State.angle * yFreq);
        
        // Perpendicular vector
        const perpX = -normY;
        const perpY = normX;

        State.ctx.beginPath();
        State.ctx.moveTo(
            currentX - perpX * P.Tan.limit.val,
            currentY - perpY * P.Tan.limit.val
        );
        State.ctx.lineTo(
            currentX + perpX * P.Tan.limit.val,
            currentY + perpY * P.Tan.limit.val
        );
        State.ctx.stroke();
    }

    // Radius Line
    State.ctx.strokeStyle = '#fff';
    State.ctx.lineWidth = LW;
    State.ctx.beginPath();
    State.ctx.moveTo(0, 0);
    State.ctx.lineTo(currentX, currentY);
    State.ctx.stroke();

    // The Point
    State.ctx.fillStyle = '#fff';
    State.ctx.beginPath();
    State.ctx.arc(currentX, currentY, LW * 2, 0, Math.PI*2);
    State.ctx.fill();

    // --- 3. WAVEFORMS ---
    // Store History
    State.history.sin.unshift(currentY);
    State.history.cos.unshift(currentX);
    if(State.history.sin.length > P.Wave_Settings.length.val) {
        State.history.sin.pop();
        State.history.cos.pop();
    }

    const waveOff = R + P.Wave_Settings.offset.val;
    const spacing = P.Wave_Settings.spacing.val;

    // Draw Sin Wave (Right)
    if(P.Sin_Y.show.val && P.Sin_Y.wave.val) {
        State.ctx.strokeStyle = P.Sin_Y.color.val;
        State.ctx.lineWidth = P.Sin_Y.width.val;
        State.ctx.beginPath();
        // Connector
        State.ctx.moveTo(currentX, currentY);
        State.ctx.lineTo(waveOff, currentY);
        // Wave
        for(let i=0; i<State.history.sin.length; i++) {
            State.ctx.lineTo(waveOff + i * spacing, State.history.sin[i]);
        }
        State.ctx.stroke();
    }

    // Draw Cos Wave (Bottom)
    if(P.Cos_X.show.val && P.Cos_X.wave.val) {
        State.ctx.strokeStyle = P.Cos_X.color.val;
        State.ctx.lineWidth = P.Cos_X.width.val;
        State.ctx.beginPath();
        // Connector
        State.ctx.moveTo(currentX, currentY);
        State.ctx.lineTo(currentX, waveOff);
        // Wave
        for(let i=0; i<State.history.cos.length; i++) {
            State.ctx.lineTo(State.history.cos[i], waveOff + i * spacing);
        }
        State.ctx.stroke();
    }

    // --- 4. PARTICLES ---
    if (State.particles.length > 0) {
        for(let p of State.particles) {
            State.ctx.globalAlpha = p.life;
            State.ctx.fillStyle = p.color;
            State.ctx.beginPath();
            State.ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
            State.ctx.fill();
        }
        State.ctx.globalAlpha = 1.0;
    }

    State.ctx.restore();
    requestAnimationFrame(loop);
}

function loop() {
    update();
    draw();
}

// ==========================================
// 5. UTILITIES & EVENTS
// ==========================================

function resize() {
    State.canvas.width = window.innerWidth;
    State.canvas.height = window.innerHeight;
    State.cx = State.canvas.width / 2;
    State.cy = State.canvas.height / 2;
}

function randomize() {
    P.Simulation.radius.val = 100 + Math.random() * 150;
    P.Simulation.speed.val = (Math.random() - 0.5) * 4;
    P.Math_Mods.xMult.val = Math.floor(Math.random() * 5) + 1;
    P.Math_Mods.yMult.val = Math.floor(Math.random() * 5) + 1;
    P.Particles.enable.val = Math.random() > 0.5;
    P.Cos_X.color.val = '#' + Math.floor(Math.random()*16777215).toString(16);
    P.Sin_Y.color.val = '#' + Math.floor(Math.random()*16777215).toString(16);
    
    // Refresh UI
    initUI();
}

function resetDefaults() {
    location.reload();
}

// Initialization
window.onload = () => {
    State.canvas = document.getElementById('canvas');
    State.ctx = State.canvas.getContext('2d');
    resize();
    initUI();
    loop();

    window.addEventListener('resize', resize);
    
    // Mouse Interaction
    State.canvas.addEventListener('mousedown', (e) => {
        State.dragging = true;
        P.Simulation.paused.val = true;
        // update UI check
        initUI();
    });
    window.addEventListener('mouseup', () => {
        State.dragging = false;
        P.Simulation.paused.val = false;
        initUI();
    });
    window.addEventListener('mousemove', (e) => {
        if(State.dragging) {
            const dx = e.clientX - State.cx;
            const dy = e.clientY - State.cy;
            State.angle = Math.atan2(dy, dx);
        }
    });
};

</script>
