<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRECISION UNIT CIRCLE SIMULATOR</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #888;
            --border: #333;
            
            --c-cos: #00ffff; /* Cyan */
            --c-sin: #ff0055; /* Magenta */
            --c-tan: #00ff00; /* Lime */
            --c-sec: #ffaa00; /* Orange */
            --c-csc: #bf00ff; /* Purple */
            --c-cot: #ffffff; /* White */
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Roboto', monospace;
            display: grid;
            grid-template-columns: 1fr 400px;
            height: 100vh;
            overflow: hidden;
        }

        /* LEFT SIDE: CANVAS */
        #canvas-container {
            position: relative;
            background: #000;
            overflow: hidden;
            cursor: crosshair;
        }
        
        canvas { display: block; }

        /* OVERLAYS ON CANVAS */
        .overlay-info {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border: 1px solid #444;
        }

        /* RIGHT SIDE: DASHBOARD */
        #dashboard {
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        header {
            padding: 15px;
            background: #252525;
            border-bottom: 1px solid var(--border);
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .section-title {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* INPUT GRIDS */
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        input[type="number"], input[type="text"] {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            font-family: monospace;
            font-size: 13px;
        }
        input:focus { border-color: var(--c-cos); outline: none; }

        /* SLIDERS */
        .slider-group { margin-bottom: 15px; }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* DATA TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            font-family: monospace;
        }
        td { padding: 4px; border-bottom: 1px solid #333; }
        .val-col { text-align: right; color: #fff; font-weight: bold; }
        .row-sin { color: var(--c-sin); }
        .row-cos { color: var(--c-cos); }
        .row-tan { color: var(--c-tan); }
        .row-sec { color: var(--c-sec); }
        .row-csc { color: var(--c-csc); }
        .row-cot { color: var(--c-cot); }

        /* TOGGLES */
        .toggle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        .toggle-btn {
            background: #222;
            border: 1px solid #444;
            color: #888;
            padding: 8px 0;
            text-align: center;
            font-size: 11px;
            cursor: pointer;
            user-select: none;
        }
        .toggle-btn:hover { background: #333; }
        .toggle-btn.active { background: #fff; color: #000; font-weight: bold; border-color: #fff; }
        
        /* Color specific active states */
        .toggle-btn[data-type="sin"].active { background: var(--c-sin); color: #fff; border-color: var(--c-sin); }
        .toggle-btn[data-type="cos"].active { background: var(--c-cos); color: #000; border-color: var(--c-cos); }
        .toggle-btn[data-type="tan"].active { background: var(--c-tan); color: #000; border-color: var(--c-tan); }
        .toggle-btn[data-type="sec"].active { background: var(--c-sec); color: #000; border-color: var(--c-sec); }
        .toggle-btn[data-type="csc"].active { background: var(--c-csc); color: #fff; border-color: var(--c-csc); }
        .toggle-btn[data-type="cot"].active { background: var(--c-cot); color: #000; border-color: var(--c-cot); }

        .btn-action {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-top: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .btn-action.active { background: #d00; }

    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
        <div class="overlay-info">
            <div style="font-size: 10px; color: #888;">COORDINATES</div>
            <div id="mouse-coords" style="font-family: monospace;">0.00, 0.00</div>
        </div>
    </div>

    <div id="dashboard">
        <header>Unit Circle Laboratory</header>

        <!-- MANUAL INPUTS -->
        <div class="section">
            <div class="section-title">Angle Control</div>
            <div class="slider-group">
                <input type="range" id="slider-deg" min="0" max="360" step="0.1" value="45">
            </div>
            <div class="control-grid">
                <div class="input-group">
                    <label>Degrees (°)</label>
                    <input type="number" id="inp-deg" value="45" step="0.1">
                </div>
                <div class="input-group">
                    <label>Radians (π)</label>
                    <input type="number" id="inp-rad" value="0.25" step="0.01">
                </div>
            </div>
            <button id="btn-animate" class="btn-action">Start Rotation</button>
        </div>

        <!-- DATA READOUT -->
        <div class="section">
            <div class="section-title">Live Data Feed</div>
            <table>
                <tr class="row-sin"><td>sin(θ)</td><td class="val-col" id="val-sin">0.0000</td></tr>
                <tr class="row-cos"><td>cos(θ)</td><td class="val-col" id="val-cos">0.0000</td></tr>
                <tr class="row-tan"><td>tan(θ)</td><td class="val-col" id="val-tan">0.0000</td></tr>
                <tr class="row-sec"><td>sec(θ)</td><td class="val-col" id="val-sec">0.0000</td></tr>
                <tr class="row-csc"><td>csc(θ)</td><td class="val-col" id="val-csc">0.0000</td></tr>
                <tr class="row-cot"><td>cot(θ)</td><td class="val-col" id="val-cot">0.0000</td></tr>
            </table>
        </div>

        <!-- COMPONENT TOGGLES -->
        <div class="section">
            <div class="section-title">Component Visibility</div>
            <div class="toggle-grid">
                <div class="toggle-btn active" data-type="sin" onclick="toggle('sin')">SIN</div>
                <div class="toggle-btn active" data-type="cos" onclick="toggle('cos')">COS</div>
                <div class="toggle-btn active" data-type="tan" onclick="toggle('tan')">TAN</div>
                <div class="toggle-btn" data-type="sec" onclick="toggle('sec')">SEC</div>
                <div class="toggle-btn" data-type="csc" onclick="toggle('csc')">CSC</div>
                <div class="toggle-btn" data-type="cot" onclick="toggle('cot')">COT</div>
            </div>
            <div style="margin-top: 10px;">
                <div class="toggle-btn active" id="btn-labels" onclick="toggleLabels()">SHOW VALUE LABELS</div>
            </div>
        </div>

        <!-- SIMULATION PARAMETERS -->
        <div class="section">
            <div class="section-title">Environment</div>
            <div class="input-group" style="margin-bottom:10px;">
                <label>Unit Scale (px)</label>
                <input type="range" id="zoom-slider" min="50" max="400" value="200">
            </div>
            <div class="input-group">
                <label>Angular Velocity (deg/frame)</label>
                <input type="range" id="speed-slider" min="-5" max="5" step="0.1" value="0.5">
            </div>
        </div>
    </div>

<script>
    // --- CORE SIMULATION STATE ---
    const Sim = {
        angleRad: Math.PI / 4, // Internal master source of truth
        scale: 200,            // Pixels per unit
        animating: false,
        speed: 0.5,            // Degrees per frame
        
        // Visibility flags
        show: {
            sin: true, cos: true, tan: true,
            sec: false, csc: false, cot: false,
            labels: true
        },

        // Canvas Context
        canvas: document.getElementById('simCanvas'),
        ctx: null,
        width: 0,
        height: 0,
        cx: 0,
        cy: 0
    };

    Sim.ctx = Sim.canvas.getContext('2d');

    // --- INITIALIZATION ---
    function init() {
        resize();
        window.addEventListener('resize', resize);
        
        // Input Listeners
        document.getElementById('slider-deg').addEventListener('input', (e) => setAngleDeg(parseFloat(e.target.value)));
        
        // Exact Inputs
        document.getElementById('inp-deg').addEventListener('input', (e) => setAngleDeg(parseFloat(e.target.value)));
        document.getElementById('inp-rad').addEventListener('input', (e) => setAngleRad(parseFloat(e.target.value) * Math.PI));
        
        // Environment
        document.getElementById('zoom-slider').addEventListener('input', (e) => Sim.scale = parseInt(e.target.value));
        document.getElementById('speed-slider').addEventListener('input', (e) => Sim.speed = parseFloat(e.target.value));
        
        // Animation
        document.getElementById('btn-animate').addEventListener('click', () => {
            Sim.animating = !Sim.animating;
            const btn = document.getElementById('btn-animate');
            btn.textContent = Sim.animating ? "Stop Rotation" : "Start Rotation";
            btn.classList.toggle('active');
        });

        // Mouse Drag Interaction
        let dragging = false;
        Sim.canvas.addEventListener('mousedown', (e) => {
            dragging = true;
            updateFromMouse(e);
        });
        window.addEventListener('mouseup', () => dragging = false);
        window.addEventListener('mousemove', (e) => {
            // Update Coordinate Display
            const rect = Sim.canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left - Sim.cx) / Sim.scale;
            const y = -(e.clientY - rect.top - Sim.cy) / Sim.scale; // Invert Y
            document.getElementById('mouse-coords').textContent = `${x.toFixed(2)}, ${y.toFixed(2)}`;

            if(dragging) updateFromMouse(e);
        });

        loop();
    }

    function resize() {
        // Calculate width based on CSS grid
        const container = document.getElementById('canvas-container');
        Sim.canvas.width = container.offsetWidth;
        Sim.canvas.height = container.offsetHeight;
        Sim.width = Sim.canvas.width;
        Sim.height = Sim.canvas.height;
        Sim.cx = Sim.width / 2;
        Sim.cy = Sim.height / 2;
    }

    // --- LOGIC CONTROL ---

    function setAngleDeg(deg) {
        Sim.angleRad = deg * (Math.PI / 180);
        updateInputs();
    }

    function setAngleRad(rad) {
        Sim.angleRad = rad;
        updateInputs();
    }

    function updateFromMouse(e) {
        const rect = Sim.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left - Sim.cx;
        const my = e.clientY - rect.top - Sim.cy;
        // Invert Y for calculation because atan2 expects math coordinates (Y up), canvas is Y down
        // Actually, let's just use canvas coords and invert the result
        let angle = Math.atan2(my, mx); 
        
        // Convert canvas angle (clockwise positive) to math angle (counter-clockwise positive)
        // Canvas: Right=0, Down=PI/2. Math: Right=0, Up=PI/2.
        // We need to invert the Y input effectively.
        angle = Math.atan2(-my, mx); 

        if (angle < 0) angle += Math.PI * 2;
        Sim.angleRad = angle;
        updateInputs();
    }

    function updateInputs() {
        // Normalize 0-360
        let deg = (Sim.angleRad * (180 / Math.PI)) % 360;
        if(deg < 0) deg += 360;
        
        // Avoid infinite loops by checking active element? 
        // For simplicity, we just update values if they aren't the focused element
        if(document.activeElement.id !== 'slider-deg') 
            document.getElementById('slider-deg').value = deg;
        
        if(document.activeElement.id !== 'inp-deg') 
            document.getElementById('inp-deg').value = deg.toFixed(2);
        
        if(document.activeElement.id !== 'inp-rad') 
            document.getElementById('inp-rad').value = (Sim.angleRad / Math.PI).toFixed(2);

        updateTable();
    }

    function updateTable() {
        const s = Math.sin(Sim.angleRad);
        const c = Math.cos(Sim.angleRad);
        const t = Math.tan(Sim.angleRad);

        // Helper to format text
        const fmt = (n) => {
            if(Math.abs(n) > 100) return "∞"; // Simpler overflow visual
            return n.toFixed(4);
        };

        document.getElementById('val-sin').textContent = fmt(s);
        document.getElementById('val-cos').textContent = fmt(c);
        document.getElementById('val-tan').textContent = fmt(t);
        document.getElementById('val-sec').textContent = fmt(1/c);
        document.getElementById('val-csc').textContent = fmt(1/s);
        document.getElementById('val-cot').textContent = fmt(1/t);
    }

    function toggle(type) {
        Sim.show[type] = !Sim.show[type];
        // Visual toggle update
        const btn = document.querySelector(`.toggle-btn[data-type="${type}"]`);
        btn.classList.toggle('active');
    }

    function toggleLabels() {
        Sim.show.labels = !Sim.show.labels;
        document.getElementById('btn-labels').classList.toggle('active');
    }

    // --- RENDER ENGINE ---

    function drawLine(x1, y1, x2, y2, color, width=2, dash=[]) {
        Sim.ctx.beginPath();
        Sim.ctx.strokeStyle = color;
        Sim.ctx.lineWidth = width;
        Sim.ctx.setLineDash(dash);
        Sim.ctx.moveTo(Sim.cx + x1, Sim.cy - y1); // Note -y1 to flip Y axis
        Sim.ctx.lineTo(Sim.cx + x2, Sim.cy - y2);
        Sim.ctx.stroke();
        Sim.ctx.setLineDash([]);
    }

    function drawText(txt, x, y, color, align="center") {
        if(!Sim.show.labels) return;
        Sim.ctx.fillStyle = color;
        Sim.ctx.font = "12px monospace";
        Sim.ctx.textAlign = align;
        // Background for readability
        const width = Sim.ctx.measureText(txt).width;
        Sim.ctx.globalAlpha = 0.8;
        Sim.ctx.fillStyle = "#000";
        Sim.ctx.fillRect(Sim.cx + x - width/2 - 2, Sim.cy - y - 10, width + 4, 12);
        Sim.ctx.globalAlpha = 1.0;
        
        Sim.ctx.fillStyle = color;
        Sim.ctx.fillText(txt, Sim.cx + x, Sim.cy - y);
    }

    function draw() {
        // Clear
        Sim.ctx.fillStyle = "#000";
        Sim.ctx.fillRect(0, 0, Sim.width, Sim.height);

        // Grid
        Sim.ctx.strokeStyle = "#333";
        Sim.ctx.lineWidth = 1;
        
        // Axes
        Sim.ctx.beginPath();
        Sim.ctx.moveTo(0, Sim.cy); Sim.ctx.lineTo(Sim.width, Sim.cy);
        Sim.ctx.moveTo(Sim.cx, 0); Sim.ctx.lineTo(Sim.cx, Sim.height);
        Sim.ctx.stroke();

        // Unit Circle
        Sim.ctx.strokeStyle = "#555";
        Sim.ctx.beginPath();
        Sim.ctx.arc(Sim.cx, Sim.cy, Sim.scale, 0, Math.PI*2);
        Sim.ctx.stroke();

        // Calculations
        const r = Sim.scale;
        const theta = Sim.angleRad;
        const sin = Math.sin(theta);
        const cos = Math.cos(theta);
        const tan = Math.tan(theta);
        
        const px = cos * r;
        const py = sin * r; // Positive Y is UP in our draw logic

        // --- DRAW COMPONENTS ---

        // 1. COSINE (X-axis segment)
        if(Sim.show.cos) {
            drawLine(0, 0, px, 0, 'var(--c-cos)', 3);
            drawText(cos.toFixed(2), px/2, -15, '#00ffff');
        }

        // 2. SINE (Vertical segment from X-axis to point)
        if(Sim.show.sin) {
            drawLine(px, 0, px, py, 'var(--c-sin)', 3);
            drawText(sin.toFixed(2), px + (px>0?10:-30), py/2, '#ff0055');
        }

        // 3. RADIUS (Hypotenuse)
        drawLine(0, 0, px, py, '#fff', 2);

        // 4. TANGENT
        // Geometrically: A line tangent to the circle at (px, py)
        // Or standard unit circle def: Tangent at (1,0) (Right side)
        // Let's use the Visual Tangent Line at x=1 (or x=-1)
        if(Sim.show.tan) {
            // We draw the vertical tangent line at x = R (if cos > 0) or x = -R (if cos < 0)
            const dir = cos >= 0 ? 1 : -1;
            const tanX = r * dir;
            const tanY = tanX * tan; 
            
            // Draw the line from the x-axis intercept to the extension point
            drawLine(tanX, 0, tanX, tanY, 'var(--c-tan)', 2);
            
            // Dotted extension line from origin to meet tangent
            drawLine(0, 0, tanX, tanY, '#555', 1, [5,5]);
            
            drawText(tan.toFixed(2), tanX + (dir*20), tanY/2, '#00ff00');
        }

        // 5. COTANGENT
        // Horizontal line at y = 1 (or -1)
        if(Sim.show.cot) {
            const dir = sin >= 0 ? 1 : -1;
            const cotY = r * dir;
            const cotX = cotY / tan; // cot = 1/tan

            drawLine(0, cotY, cotX, cotY, 'var(--c-cot)', 2);
            drawLine(0, 0, cotX, cotY, '#555', 1, [5,5]); // Extension
            
            drawText((1/tan).toFixed(2), cotX/2, cotY + (dir*15), '#fff');
        }

        // 6. SECANT & COSECANT (Hypotenuse extensions)
        // Secant is the distance from center to where the tangent intersects the X axis?
        // Actually, usually Secant is drawn on the X axis.
        // Let's draw the actual Secant Line segment on the axis for clarity.
        
        if(Sim.show.sec) {
            // Secant intersects X axis
            const secX = r / cos;
            if(Math.abs(secX) < 5000) {
                drawLine(0, 0, secX, 0, 'var(--c-sec)', 4); // On X Axis
                // Visual connector (dotted)
                drawLine(px, py, secX, 0, 'var(--c-sec)', 1, [2,2]); 
                drawText((1/cos).toFixed(2), secX/2, 15, '#ffaa00');
            }
        }

        if(Sim.show.csc) {
            // Cosecant intersects Y axis
            const cscY = r / sin;
            if(Math.abs(cscY) < 5000) {
                drawLine(0, 0, 0, cscY, 'var(--c-csc)', 4); // On Y Axis
                // Visual connector
                drawLine(px, py, 0, cscY, 'var(--c-csc)', 1, [2,2]);
                drawText((1/sin).toFixed(2), 15, cscY/2, '#bf00ff');
            }
        }

        // Point Marker
        Sim.ctx.beginPath();
        Sim.ctx.arc(Sim.cx + px, Sim.cy - py, 5, 0, Math.PI*2);
        Sim.ctx.fillStyle = "#fff";
        Sim.ctx.fill();

        // Angle Arc
        Sim.ctx.beginPath();
        // ctx.arc uses clockwise screen coords. Math is Counter Clockwise.
        // We draw from 0 to -theta to represent upward math rotation
        Sim.ctx.arc(Sim.cx, Sim.cy, 30, 0, -theta, true);
        Sim.ctx.strokeStyle = "#fff";
        Sim.ctx.lineWidth = 1;
        Sim.ctx.stroke();

    }

    function loop() {
        if(Sim.animating) {
            Sim.angleRad += Sim.speed * (Math.PI / 180);
            updateInputs();
        }
        draw();
        requestAnimationFrame(loop);
    }

    // Start
    init();

</script>
</body>
</html>
